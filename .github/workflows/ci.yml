name: CI

# CI verification gates: fail the workflow when any check fails.
#
# Run the same Makefile verify and verify-web targets required before local commits.
# Keeping one verification entrypoint prevents local/CI discrepancies.
#
# End-to-end tests are excluded: they require real ZFS pools, LIO, keepalived, and multiple hosts,
# which hosted CI cannot provide. See tools/e2e/README.md; archive results manually.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt / vet / test / Static build
        run: make verify
      - name: Coverage (report only; no threshold)
        run: |
          go test ./... -coverprofile=coverage.out >/dev/null 2>&1 || true
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ndiskless-linux-amd64
          path: bin/ndiskless-linux-amd64
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: vitest / vite build
        run: make verify-web

  # Release artifacts are a static binary with embedded frontend and an installable .deb as described in the README.
  # The tagged commit is the release rollback baseline.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Release creation and artifact uploads require write access; the default token may be read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Versioning uses git describe. A shallow checkout lacks tag history and can produce
          # a raw commit hash that does not match the release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.2', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # make deb includes build-static; dpkg-deb is provided on the Ubuntu runner.
      - run: make deb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/ndiskless-linux-amd64
            dist/ndiskless_*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
